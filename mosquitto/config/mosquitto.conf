# ── PORT D'ÉCOUTE ─────────────────────────────────────────
# Mosquitto écoute sur le port standard MQTT 1883.
# Les capteurs IoT publient leurs données sur ce port.
listener 1883

# ── AUTHENTIFICATION ──────────────────────────────────────
# En développement on autorise les connexions anonymes.
# En production : mettre à false et configurer des comptes.
allow_anonymous true

# ── PERSISTANCE ───────────────────────────────────────────
# Mosquitto sauvegarde les messages sur disque.
# Ainsi les messages ne sont pas perdus en cas de redémarrage.
persistence true
persistence_location /mosquitto/data/

# ── LOGS ──────────────────────────────────────────────────
# Les logs permettent de diagnostiquer les problèmes de connexion
# des capteurs ou les messages mal formés.
log_dest file /mosquitto/log/mosquitto.log
