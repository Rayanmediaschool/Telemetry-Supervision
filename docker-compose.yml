services:

  # ── BROKER MQTT ────────────────────────────────────────────
  # Mosquitto est le "facteur" du réseau IoT.
  # Les capteurs lui envoient leurs données, il les redistribue à Telegraf.
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # ── BRIDGE IoT → PROMETHEUS ────────────────────────────────
  # Telegraf fait le pont entre le monde MQTT et Prometheus.
  telegraf:
    image: telegraf:1.32
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "9273:9273"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  # ── COLLECTE + TSDB ────────────────────────────────────────
  # Prometheus est le coeur du système.
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

  # ── ALERTING ───────────────────────────────────────────────
  # Alertmanager reçoit les alertes et les route par domaine.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # ── EXPORTER OS HÔTE ─────────────────────────────────────
  # Node Exporter surveille la machine Linux.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'

  # ── EXPORTER DOCKER ──────────────────────────────────────
  # cAdvisor surveille les conteneurs Docker.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # ── PUSHGATEWAY ──────────────────────────────────────────
  # Permet aux jobs éphémères de pousser leurs métriques.
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"

  # ── VISUALISATION ─────────────────────────────────────────
  # Grafana affiche les données sous forme de dashboards.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

  # ── MICROSERVICE DEMO ─────────────────────────────────────
  # Mini application FastAPI qui expose des métriques RED.
  microservice:
    build: ./microservice
    container_name: microservice
    restart: unless-stopped
    ports:
      - "8000:8000"

  # ── SIMULATEUR IOT ────────────────────────────────────────
  # Script Python qui simule 4 capteurs physiques.
  # Publie température, pression, vibration et batterie
  # en MQTT sur Mosquitto toutes les 5 secondes.
  simulateur-iot:
    build: ./simulateur-iot
    container_name: simulateur-iot
    restart: unless-stopped
    depends_on:
      - mosquitto

# ── VOLUMES PERSISTANTS ───────────────────────────────────
# Les volumes Docker permettent de conserver les données
# même si les conteneurs sont supprimés et recréés.
volumes:
  prometheus_data:   # Données Prometheus (métriques historiques)
  grafana_data:      # Données Grafana (utilisateurs, préférences)
